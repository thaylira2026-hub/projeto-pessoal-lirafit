<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Fundo circular roxo -->
  <circle cx="100" cy="100" r="100" fill="#9B7FD4"/>

  <!-- Brilho no fundo -->
  <circle cx="70" cy="60" r="40" fill="white" opacity="0.08"/>

  <!-- Antena -->
  <rect x="97" y="18" width="6" height="22" rx="3" fill="#F5F0FF"/>
  <circle cx="100" cy="14" r="8" fill="#7B5FB5"/>
  <circle cx="100" cy="14" r="4" fill="#F5F0FF"/>

  <!-- Cabeça do robô -->
  <rect x="48" y="40" width="104" height="82" rx="20" fill="#F5F0FF"/>
  <!-- Detalhe da cabeça -->
  <rect x="56" y="48" width="88" height="66" rx="14" fill="white"/>

  <!-- Olho esquerdo -->
  <circle cx="76" cy="76" r="13" fill="#9B7FD4"/>
  <circle cx="76" cy="76" r="8" fill="#7B5FB5"/>
  <circle cx="79" cy="73" r="3" fill="white"/>

  <!-- Olho direito -->
  <circle cx="124" cy="76" r="13" fill="#9B7FD4"/>
  <circle cx="124" cy="76" r="8" fill="#7B5FB5"/>
  <circle cx="127" cy="73" r="3" fill="white"/>

  <!-- Sorriso -->
  <path d="M 78 98 Q 100 114 122 98" stroke="#9B7FD4" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Corpo -->
  <rect x="62" y="128" width="76" height="50" rx="14" fill="#F5F0FF"/>
  <!-- Detalhe do peito -->
  <rect x="70" y="136" width="60" height="34" rx="8" fill="white"/>
  <!-- Letras LF no peito -->
  <text x="100" y="159" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#9B7FD4" text-anchor="middle">LF</text>

  <!-- Halteres (braços) -->
  <!-- Braço esquerdo -->
  <rect x="22" y="138" width="36" height="9" rx="4" fill="#F5F0FF"/>
  <rect x="17" y="132" width="10" height="21" rx="5" fill="#7B5FB5"/>
  <rect x="51" y="132" width="10" height="21" rx="5" fill="#7B5FB5"/>

  <!-- Braço direito -->
  <rect x="142" y="138" width="36" height="9" rx="4" fill="#F5F0FF"/>
  <rect x="137" y="132" width="10" height="21" rx="5" fill="#7B5FB5"/>
  <rect x="171" y="132" width="10" height="21" rx="5" fill="#7B5FB5"/>

  <!-- Pernas -->
  <rect x="70" y="180" width="24" height="16" rx="7" fill="#7B5FB5"/>
  <rect x="106" y="180" width="24" height="16" rx="7" fill="#7B5FB5"/>

</svg>
